[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatmod"
version = "1.0.0"
description = "Real-time Turkish chat moderation: lexicon, tf-idf, word2vec+FFN, BERTurk and INT8 BERTurk"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
