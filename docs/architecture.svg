<rect x="30" y="700" width="1540" height="250" rx="12" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="7 5"/>
<text x="44" y="722" font-size="13" font-weight="700" letter-spacing="1.2" fill="#52606d">OFFLINE · BUILT ONCE (scripts/)</text>
<rect x="45" y="742" width="330" height="176" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="57" y="766" font-size="16" font-weight="700" fill="#1f2933">Data · prepare_data.py</text>
<text x="57" y="788" font-size="13.5" fill="#52606d">OffensEval-TR 2020 (Çöltekin, CC-BY)</text>
<text x="57" y="807" font-size="13.5" fill="#52606d">official train → train 28,580 /</text>
<text x="57" y="826" font-size="13.5" fill="#52606d">val 3,176 (90/10, stratified, seed 42)</text>
<text x="57" y="845" font-size="13.5" fill="#52606d">official test 3,528: final comparison</text>
<text x="57" y="864" font-size="13.5" fill="#52606d">only, never used for tuning</text>
<rect x="405" y="742" width="380" height="176" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="417" y="766" font-size="16" font-weight="700" fill="#1f2933">Training · train_*.py</text>
<text x="417" y="788" font-size="13.5" fill="#52606d">lexicon, tf-idf + LR, word2vec + FFN (SGD)</text>
<text x="417" y="807" font-size="13.5" fill="#52606d">BERTurk fine-tuning (mixed precision)</text>
<text x="417" y="826" font-size="13.5" fill="#52606d">every threshold / hyper-parameter</text>
<text x="417" y="845" font-size="13.5" fill="#52606d">chosen on the validation split</text>
<rect x="417" y="880" width="40" height="21" rx="10.5" fill="#2a6fdb"/><text x="437" y="895" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">CPU</text>
<rect x="470" y="880" width="191" height="21" rx="10.5" fill="#c2410c"/><text x="565" y="895" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">GPU · RTX 4060 (BERTurk)</text>
<rect x="815" y="742" width="360" height="176" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="827" y="766" font-size="16" font-weight="700" fill="#1f2933">Quantize + evaluate</text>
<text x="827" y="788" font-size="13.5" fill="#52606d">quantize.py: dynamic INT8 + thresholds</text>
<text x="827" y="807" font-size="13.5" fill="#52606d">tuned on val (CPU, 1 thread, 1 message)</text>
<text x="827" y="826" font-size="13.5" fill="#52606d">evaluate_all.py: same test set,</text>
<text x="827" y="845" font-size="13.5" fill="#52606d">latency on Intel(R) Core(TM) i7-13700H</text>
<rect x="827" y="880" width="119" height="21" rx="10.5" fill="#2a6fdb"/><text x="886" y="895" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">CPU · 1 thread</text>
<rect x="1205" y="742" width="350" height="176" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="1217" y="766" font-size="16" font-weight="700" fill="#1f2933">Model hosting</text>
<text x="1217" y="788" font-size="13.5" fill="#52606d">Hugging Face Hub (pinned commit)</text>
<text x="1217" y="807" font-size="13.5" fill="#52606d">mirror: Google Drive (SHA-256)</text>
<text x="1217" y="826" font-size="13.5" fill="#52606d">download.py · ensure_models():</text>
<text x="1217" y="845" font-size="13.5" fill="#52606d">first start → models/ (local disk)</text>
<text x="1217" y="864" font-size="13.5" fill="#52606d">weights are not in the GitHub repo</text>
