<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="970" fill="#ffffff"/>
<text x="40" y="44" font-size="26" font-weight="700" fill="#1f2933">Architecture · real-time Turkish chat moderation</text>
<text x="40" y="70" font-size="14.5" fill="#52606d">Inference path (top): one message, one model call, CPU only, 1 PyTorch thread · offline path (bottom): how the models were built. Code: app.py, src/chatmod/.</text>
<rect x="30" y="110" width="250" height="560" rx="12" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="7 5"/>
<text x="44" y="132" font-size="13" font-weight="700" letter-spacing="1.2" fill="#52606d">BROWSER · INPUT</text>
<rect x="183" y="118" width="83" height="21" rx="10.5" fill="#52606d"/><text x="225" y="133" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Gradio UI</text>
<rect x="45" y="150" width="220" height="112" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="57" y="174" font-size="16" font-weight="700" fill="#1f2933">Chat message</text>
<text x="57" y="196" font-size="13.5" fill="#52606d">typed live in the lobby box,</text>
<text x="57" y="215" font-size="13.5" fill="#52606d">e.g. “s4l4k mısın”</text>
<text x="57" y="234" font-size="13.5" fill="#52606d">→ send() in app.py</text>
<rect x="45" y="285" width="220" height="150" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="57" y="309" font-size="16" font-weight="700" fill="#1f2933">Model switcher</text>
<text x="57" y="331" font-size="13.5" fill="#52606d">radio list of the 5 models,</text>
<text x="57" y="350" font-size="13.5" fill="#52606d">default: BERTurk INT8</text>
<text x="57" y="369" font-size="13.5" fill="#52606d">one model per message</text>
<text x="57" y="388" font-size="13.5" fill="#52606d">→ classify() in app.py</text>
<rect x="45" y="458" width="220" height="112" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="57" y="482" font-size="16" font-weight="700" fill="#1f2933">Compare all five</text>
<text x="57" y="504" font-size="13.5" fill="#52606d">button: runs the message</text>
<text x="57" y="523" font-size="13.5" fill="#52606d">through every model</text>
<text x="57" y="542" font-size="13.5" fill="#52606d">→ compare() in app.py</text>
<rect x="300" y="110" width="1020" height="560" rx="12" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="7 5"/>
<text x="314" y="132" font-size="13" font-weight="700" letter-spacing="1.2" fill="#52606d">PYTHON SERVER · python app.py · runs locally</text>
<rect x="1115" y="118" width="191" height="21" rx="10.5" fill="#2a6fdb"/><text x="1211" y="133" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">CPU · 1 thread / message</text>
<text x="318" y="160" font-size="13" font-weight="700" fill="#52606d">1 · PREPROCESSING</text>
<rect x="315" y="172" width="220" height="178" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="327" y="196" font-size="16" font-weight="700" fill="#1f2933">normalize()</text>
<text x="327" y="218" font-size="13.5" fill="#52606d">normalize.py · every model</text>
<text x="327" y="237" font-size="13.5" fill="#52606d">Turkish lowercase I→ı, İ→i</text>
<text x="327" y="256" font-size="13.5" fill="#52606d">leetspeak: s4l4k → salak</text>
<text x="327" y="275" font-size="13.5" fill="#52606d">repeated letters: aaa → a</text>
<text x="327" y="294" font-size="13.5" fill="#52606d">whitespace squeezing</text>
<text x="327" y="313" font-size="13.5" fill="#52606d">regex, no learned weights</text>
<rect x="345" y="378" width="190" height="96" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="357" y="402" font-size="16" font-weight="700" fill="#1f2933">asciify() + words</text>
<text x="357" y="424" font-size="13.5" fill="#52606d">ç ğ ı ö ş ü → c g i o s u</text>
<text x="357" y="443" font-size="13.5" fill="#52606d">lexicon.tokenize()</text>
<text x="357" y="462" font-size="13.5" fill="#52606d">classical_preprocess()</text>
<rect x="315" y="500" width="220" height="96" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="327" y="524" font-size="16" font-weight="700" fill="#1f2933">WordPiece tokenizer</text>
<text x="327" y="546" font-size="13.5" fill="#52606d">BERTurk vocabulary</text>
<text x="327" y="565" font-size="13.5" fill="#52606d">max 128 tokens</text>
<text x="327" y="584" font-size="13.5" fill="#52606d">AutoTokenizer</text>
<text x="573" y="160" font-size="13" font-weight="700" fill="#52606d">2 · MODELS · predictors.py (name · precision · size)</text>
<rect x="570" y="172" width="400" height="72" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="584" y="197" font-size="16" font-weight="700" fill="#1f2933">Lexicon + edit distance</text>
<text x="956" y="197" font-size="13" font-weight="700" text-anchor="end" fill="#52606d">rules · 0.0009 MB</text>
<text x="584" y="222" font-size="13.5" fill="#52606d">58 words learned from train · own Levenshtein</text>
<rect x="570" y="258" width="400" height="72" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="584" y="283" font-size="16" font-weight="700" fill="#1f2933">tf-idf + logistic regression</text>
<text x="956" y="283" font-size="13" font-weight="700" text-anchor="end" fill="#52606d">FP64 · 3.88 MB</text>
<text x="584" y="308" font-size="13.5" fill="#52606d">word 1–2-grams + char 2–5-grams · scikit-learn</text>
<rect x="570" y="344" width="400" height="72" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="584" y="369" font-size="16" font-weight="700" fill="#1f2933">word2vec + feedforward NN</text>
<text x="956" y="369" font-size="13" font-weight="700" text-anchor="end" fill="#52606d">FP32 · 44.3 MB</text>
<text x="584" y="394" font-size="13.5" fill="#52606d">own word2vec 200-d (mean) → 200→256→2 · PyTorch</text>
<rect x="570" y="430" width="400" height="72" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="584" y="455" font-size="16" font-weight="700" fill="#1f2933">BERTurk fine-tuned</text>
<text x="956" y="455" font-size="13" font-weight="700" text-anchor="end" fill="#52606d">FP32 · 422 MB</text>
<text x="584" y="480" font-size="13.5" fill="#52606d">dbmdz/bert-base-turkish-uncased + classifier</text>
<rect x="570" y="516" width="400" height="72" rx="8" fill="#e3f6f2" stroke="#0b8a78" stroke-width="2.5"/>
<text x="584" y="541" font-size="16" font-weight="700" fill="#1f2933">BERTurk quantized</text>
<text x="956" y="541" font-size="13" font-weight="700" text-anchor="end" fill="#0b8a78">INT8 · 177 MB · app default</text>
<text x="584" y="566" font-size="13.5" fill="#52606d">torch quantize_dynamic: nn.Linear → INT8</text>
<text x="1008" y="160" font-size="13" font-weight="700" fill="#52606d">3 · POST-PROCESSING · predictors.py · app.py</text>
<rect x="1005" y="172" width="300" height="130" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="1017" y="196" font-size="16" font-weight="700" fill="#1f2933">Decision · Predictor.predict()</text>
<text x="1017" y="218" font-size="13.5" fill="#52606d">P(offensive) ≥ threshold → offensive</text>
<text x="1017" y="237" font-size="13.5" fill="#52606d">thresholds tuned on validation:</text>
<text x="1017" y="256" font-size="13.5" fill="#52606d">tf-idf 0.58 · FFN 0.66 · FP32 0.42 · INT8 0.34</text>
<text x="1017" y="275" font-size="13.5" fill="#52606d">lexicon: any rule hit</text>
<rect x="1005" y="320" width="300" height="76" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="1017" y="344" font-size="16" font-weight="700" fill="#1f2933">Masking · app.py</text>
<text x="1017" y="366" font-size="13.5" fill="#52606d">flagged text → redaction bars</text>
<text x="1017" y="385" font-size="13.5" fill="#52606d">(original never shown)</text>
<rect x="1005" y="414" width="300" height="76" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="1017" y="438" font-size="16" font-weight="700" fill="#1f2933">Normalization tags</text>
<text x="1017" y="460" font-size="13.5" fill="#52606d">normalization_steps(): which</text>
<text x="1017" y="479" font-size="13.5" fill="#52606d">regex rules fired (no words shown)</text>
<rect x="1005" y="508" width="300" height="96" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="1017" y="532" font-size="16" font-weight="700" fill="#1f2933">Latency · app.py classify()</text>
<text x="1017" y="554" font-size="13.5" fill="#52606d">time.perf_counter() around the</text>
<text x="1017" y="573" font-size="13.5" fill="#52606d">model call · budget 50 ms (mean)</text>
<text x="1017" y="592" font-size="13.5" fill="#52606d">ping meter: ≤25 · ≤50 · over</text>
<rect x="1340" y="110" width="230" height="560" rx="12" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="7 5"/>
<text x="1354" y="132" font-size="13" font-weight="700" letter-spacing="1.2" fill="#52606d">BROWSER · OUTPUT</text>
<rect x="1352" y="150" width="206" height="200" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="1364" y="174" font-size="16" font-weight="700" fill="#1f2933">Chat feed</text>
<text x="1364" y="196" font-size="13.5" fill="#52606d">one line per message:</text>
<text x="1364" y="215" font-size="13.5" fill="#52606d">CLEAN / FLAGGED + P(off),</text>
<text x="1364" y="234" font-size="13.5" fill="#52606d">masked text,</text>
<text x="1364" y="253" font-size="13.5" fill="#52606d">normalization tags,</text>
<text x="1364" y="272" font-size="13.5" fill="#52606d">ms and model</text>
<rect x="1352" y="368" width="206" height="112" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="1364" y="392" font-size="16" font-weight="700" fill="#1f2933">Compare table</text>
<text x="1364" y="414" font-size="13.5" fill="#52606d">5 models side by side:</text>
<text x="1364" y="433" font-size="13.5" fill="#52606d">verdict, threshold,</text>
<text x="1364" y="452" font-size="13.5" fill="#52606d">ms, ping</text>
<rect x="1352" y="498" width="206" height="150" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="1364" y="522" font-size="16" font-weight="700" fill="#1f2933">Response-time log</text>
<text x="1364" y="544" font-size="13.5" fill="#52606d">side panel: ms of every</text>
<text x="1364" y="563" font-size="13.5" fill="#52606d">message, mean, % within</text>
<text x="1364" y="582" font-size="13.5" fill="#52606d">budget, chart with</text>
<text x="1364" y="601" font-size="13.5" fill="#52606d">the 50 ms line</text>
